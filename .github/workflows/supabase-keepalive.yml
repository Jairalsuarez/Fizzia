name: Supabase keepalive

on:
  schedule:
    - cron: '17 4 * * *'
    - cron: '17 10 * * *'
    - cron: '17 16 * * *'
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Supabase database
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Keep project active
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

          ping_database() {
            local table="$1"

            curl --fail --silent --show-error --max-time 20 \
              "$SUPABASE_URL/rest/v1/$table?select=*&limit=1" \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $SUPABASE_ANON_KEY"
          }

          run_keepalive_queries() {
            ping_database "site_settings" >/dev/null
            ping_database "services" >/dev/null
            ping_database "faqs" >/dev/null
          }

          if run_keepalive_queries; then
            echo "Supabase database is active."
            exit 0
          fi

          echo "Initial database ping failed. The project may be paused."

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured, so the workflow cannot restore a paused project automatically."
            exit 1
          fi

          PROJECT_REF="${SUPABASE_PROJECT_REF:-}"
          if [ -z "$PROJECT_REF" ]; then
            PROJECT_REF="$(printf '%s' "$SUPABASE_URL" | sed -E 's#https://([^.]+).*#\1#')"
          fi

          echo "Requesting Supabase project restore for $PROJECT_REF."

          curl --fail --silent --show-error --max-time 20 \
            --request POST "https://api.supabase.com/v1/projects/$PROJECT_REF/restore" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}'

          for attempt in 1 2 3 4 5 6; do
            echo "Waiting for Supabase to resume, attempt $attempt."
            sleep 30

            if run_keepalive_queries; then
              echo "Supabase project restored and database ping succeeded."
              exit 0
            fi
          done

          echo "Supabase project restore was requested, but the database did not respond in time."
          exit 1
